<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Фон со скруглением -->
  <rect width="32" height="32" rx="8" fill="#09090b"/>
  
  <!-- Градиентная буква / символ OX -->
  <defs>
    <linearGradient id="optix-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
  </defs>

  <!-- Круг-линза (O) -->
  <circle cx="11" cy="16" r="5.5" stroke="url(#optix-grad)" stroke-width="2.5" fill="none"/>
  
  <!-- Перекрестие (X) -->
  <path d="M20 11L26 21M26 11L20 21" stroke="#fafafa" stroke-width="2.5" stroke-linecap="round"/>
</svg>
